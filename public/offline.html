<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internet aloqasi yo'q — Izdosh Academy</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0a1628;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      .mark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 48px;
        font-weight: 700;
        color: #c9a227;
        line-height: 1;
      }
      h1 { font-size: 20px; margin: 0; }
      p { margin: 0; color: #96a0ad; max-width: 320px; font-size: 14px; }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #c9a227;
        background: transparent;
        color: #c9a227;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">I</div>
      <h1>Internet aloqasi yo'q</h1>
      <p>Bu sahifa oldin ochilmagan, shuning uchun oflayn ko'rsatib bo'lmaydi. Aloqa tiklangach qayta urinib ko'ring.</p>
      <button onclick="location.reload()">Qayta urinish</button>
    </div>
  </body>
</html>
